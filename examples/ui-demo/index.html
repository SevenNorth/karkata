<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Karkata UI Demo</title>
  <style>
    :root {
      color: #171a1c;
      background: #e9edef;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }

    html, body { min-width: 280px; min-height: 100%; margin: 0; }

    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
      overflow: hidden;
    }

    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 22px;
      color: #f7f8f8;
      background: #242a2d;
      border-bottom: 1px solid #161a1c;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: none;
      color: #ffffff;
      background: #2e7655;
      border: 1px solid #5ca17f;
      border-radius: 6px;
      font-size: 14px;
    }

    .environment {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #cbd1d4;
      font-size: 12px;
    }

    .indicator {
      width: 7px;
      height: 7px;
      flex: none;
      background: #6fc596;
      border-radius: 50%;
    }

    #reset {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      margin-left: 6px;
      padding: 0;
      color: #edf0f1;
      background: transparent;
      border: 1px solid #555e62;
      border-radius: 6px;
      font: 18px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    #reset:hover { background: #343b3f; }
    #reset:focus-visible { outline: 2px solid #78c9a0; outline-offset: 2px; }

    main {
      min-width: 0;
      min-height: 0;
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    karkata-panel {
      --karkata-background: #ffffff;
      --karkata-surface: #f1f4f5;
      --karkata-border: #ccd3d6;
      --karkata-text: #171a1c;
      --karkata-muted: #626b70;
      --karkata-accent: #246f50;
      --karkata-danger: #bd372d;
      height: 100%;
      min-height: 0;
    }

    karkata-panel::part(panel) {
      height: 100%;
      min-height: 0;
      max-height: none;
      box-shadow: 0 8px 24px rgb(22 30 34 / 10%);
    }

    karkata-panel::part(header) { background: #fafbfb; }
    karkata-panel::part(message-user) { background: #edf7f1; }

    @media (max-width: 600px) {
      body { grid-template-rows: 50px minmax(0, 1fr); }
      .app-bar { padding: 0 12px; }
      .environment-label { display: none; }
      main { padding: 0; }
      karkata-panel::part(panel) { border: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">K</span>
      <span>Karkata UI</span>
    </div>
    <div class="environment">
      <span class="indicator" aria-hidden="true"></span>
      <span class="environment-label">本地模拟</span>
      <button id="reset" type="button" title="重置演示" aria-label="重置演示">↻</button>
    </div>
  </header>
  <main>
    <karkata-panel></karkata-panel>
  </main>

  <script type="module" src="/examples/ui-demo/app.mjs"></script>
</body>
</html>
